# How long each kind of file may be kept.
#
# A `map` rather than `add_header` per location, and that is not style. In
# nginx, an `add_header` inside a location **replaces** every header inherited
# from the server block — so the moment `/_nuxt/` set its own cache directive,
# it silently lost nosniff, DENY and the referrer policy. One map and one set
# of headers at server level cannot drift apart that way.
map $uri $fidelity_cache {
  # Documents and anything unhashed. The shell names the current asset hashes,
  # so a stale one asks for files that no longer exist.
  default   "no-cache";

  # Hashed filenames: the name changes when the content does, so the browser
  # never has to ask again.
  ~^/_nuxt/   "public, max-age=31536000, immutable";
  ~^/_fonts/  "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The addresses this app used to have.
  #
  # Every screen was under a German path until ADR-010. A real 301 here means a
  # bookmark is corrected in the address bar rather than only in the app, and it
  # costs nothing — the app carries the same table for anybody without a server.
  #
  # `$is_args$args` is not decoration: the vault's OAuth flow comes back to
  # what used to be /einstellungen/abgleich carrying `?code=…`, registered at
  # Dropbox and Google by the user and unchangeable from here. Dropping the
  # query would refuse the exchange.
  location = /korb { return 301 /basket$is_args$args; }
  location = /regal { return 301 /shelf$is_args$args; }
  location = /haendler { return 301 /dealers$is_args$args; }
  location = /landkarte { return 301 /map$is_args$args; }
  location = /gemerkt { return 301 /saved$is_args$args; }
  location = /im-laden { return 301 /in-store$is_args$args; }
  location = /willkommen { return 301 /welcome$is_args$args; }
  location = /datenschutz { return 301 /privacy$is_args$args; }
  location = /impressum { return 301 /legal$is_args$args; }
  location = /einstellungen/abgleich { return 301 /settings/sync$is_args$args; }
  location = /einstellungen/darstellung { return 301 /settings/appearance$is_args$args; }
  location = /einstellungen/daten { return 301 /settings/data$is_args$args; }
  location = /einstellungen/hilfe { return 301 /settings/help$is_args$args; }
  location = /einstellungen/hub { return 301 /settings/hub$is_args$args; }
  location = /einstellungen/konto { return 301 /settings/account$is_args$args; }
  location = /einstellungen/sammlung { return 301 /settings/collection$is_args$args; }
  location = /einstellungen/suche { return 301 /settings/search$is_args$args; }
  location = /einstellungen { return 301 /settings$is_args$args; }

  # The app decides its own routes.
  #
  # Nuxt prerenders each one into its own directory, so /saved is really
  # saved/index.html. Serving it directly matters: `$uri/` would make nginx
  # answer 301 to /saved/ instead, and a trailing slash is a different URL
  # to the router, to the precache and to whoever bookmarked it.
  #
  # Anything with no file behind it at all is still a route — the shell takes
  # over from there, which is why it is 200.html and not a 404.
  location / {
    try_files $uri $uri.html $uri/index.html /200.html;
  }

  location /_nuxt/ {
    try_files $uri =404;
  }

  # The service worker decides when everything else updates, so it must never
  # be the stale thing. A cached sw.js is an app that can never be fixed.
  #
  # It falls under the map's default, which is the point: it used to need its
  # own rule, and a rule that has to be remembered per file is a rule that will
  # be forgotten for the next one.
  location = /sw.js {
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Cache-Control $fidelity_cache always;

  # Nothing here is meant for a search index (docs/00 §9).
  add_header X-Robots-Tag "noindex, nofollow" always;

  # This app talks to api.discogs.com from the browser and to a hub the user
  # names. It does not embed anything and is not meant to be embedded.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
}
