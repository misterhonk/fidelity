# How long each kind of file may be kept.
#
# A `map` rather than `add_header` per location, and that is not style. In
# nginx, an `add_header` inside a location **replaces** every header inherited
# from the server block — so the moment `/_nuxt/` set its own cache directive,
# it silently lost nosniff, DENY and the referrer policy. One map and one set
# of headers at server level cannot drift apart that way.
map $uri $fidelity_cache {
  # Documents and anything unhashed. The shell names the current asset hashes,
  # so a stale one asks for files that no longer exist.
  default   "no-cache";

  # Hashed filenames: the name changes when the content does, so the browser
  # never has to ask again.
  ~^/_nuxt/   "public, max-age=31536000, immutable";
  ~^/_fonts/  "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The app decides its own routes.
  #
  # Nuxt prerenders each one into its own directory, so /gemerkt is really
  # gemerkt/index.html. Serving it directly matters: `$uri/` would make nginx
  # answer 301 to /gemerkt/ instead, and a trailing slash is a different URL
  # to the router, to the precache and to whoever bookmarked it.
  #
  # Anything with no file behind it at all is still a route — the shell takes
  # over from there, which is why it is 200.html and not a 404.
  location / {
    try_files $uri $uri.html $uri/index.html /200.html;
  }

  location /_nuxt/ {
    try_files $uri =404;
  }

  # The service worker decides when everything else updates, so it must never
  # be the stale thing. A cached sw.js is an app that can never be fixed.
  #
  # It falls under the map's default, which is the point: it used to need its
  # own rule, and a rule that has to be remembered per file is a rule that will
  # be forgotten for the next one.
  location = /sw.js {
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Cache-Control $fidelity_cache always;

  # Nothing here is meant for a search index (docs/00 §9).
  add_header X-Robots-Tag "noindex, nofollow" always;

  # This app talks to api.discogs.com from the browser and to a hub the user
  # names. It does not embed anything and is not meant to be embedded.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
}
