# Local development stack.
#
#   docker compose -f docker/compose.yml up
#     → migrations run, app on http://localhost:3000, Mailpit on :8025
#
# Compose reads docker/.env for the variables below; all of them are optional,
# so a fresh clone starts without any configuration. See .env.example.
#
# Uberspace does not run Docker. This stack is for local work and production
# parity; the deploy there uses the .output directory directly (docs/08).

name: fidelity

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    ports: ['3000:3000']
    volumes:
      - ..:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed by
      # the host's, which is built for a different platform.
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://fidelity:dev@db:5432/fidelity
      NUXT_DISCOGS_CONSUMER_KEY: ${DISCOGS_KEY:-}
      NUXT_DISCOGS_CONSUMER_SECRET: ${DISCOGS_SECRET:-}
      NUXT_TOKEN_KEY: ${TOKEN_KEY:-dev-only-not-a-secret}
      # Mailpit speaks SMTP on 1025 (M6 digest mails).
      SMTP_URL: smtp://mailpit:1025
    command: >
      sh -c "pnpm tokens:build && pnpm db:migrate && pnpm dev --host 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

  db:
    # Same major as Uberspace 7, which offers 12–15 with 15 as the default.
    # Verify before changing: `uberspace tools version list postgresql`.
    image: postgres:15
    environment:
      POSTGRES_USER: fidelity
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fidelity
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fidelity']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

  # Gives the local instance a real HTTPS URL. Needed for PWA installation on
  # iOS, for Web Push, and for the OAuth callback Discogs will not otherwise
  # accept.  docker compose -f docker/compose.yml --profile tunnel up
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    profiles: ['tunnel']
    depends_on: [app]

volumes:
  pgdata: {}
