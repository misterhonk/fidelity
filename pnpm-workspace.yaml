# pnpm 11 reads project-level settings from here, not from package.json.
# Dependency build scripts are blocked by default; this is the explicit
# allow-list. Every entry is a deliberate decision, not a convenience.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
