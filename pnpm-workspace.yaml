# pnpm 11 reads project-level settings from here, not from package.json.
# Dependency build scripts are blocked by default; this is the explicit
# allow-list. Every entry is a deliberate decision, not a convenience.
allowBuilds:
  esbuild: true
  # Downloads the platform binary and installs the git hooks.
  lefthook: true
  # Native resolver behind eslint-plugin-import-x; fetches its platform binary.
  unrs-resolver: true
  # Pulled in by @vueuse/* via @nuxt/ui; its postinstall only picks the Vue 2
  # or the Vue 3 entry point.
  vue-demi: true

# pnpm holds back freshly published versions as a supply-chain guard. These two
# were current when the project was scaffolded.
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
