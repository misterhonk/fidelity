name: CI

on:
  pull_request:
    # The default three plus `ready_for_review`: a draft runs quality only
    # (see the job conditions below), so leaving draft has to start the rest.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Least privilege, workflow-wide.
permissions:
  contents: read

# A new push to a pull request cancels the run it makes obsolete. On main
# nothing is cancelled and nothing is superseded: every commit gets a group of
# its own, because a shared group would still drop a *pending* run when a
# third one queues behind it, and each commit on main is a release candidate.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # release-please's own pull request carries a version bump and a generated
  # changelog and nothing else. Its commits have already run this workflow on
  # main, and its runs sit at `action_required` forever because the bot counts
  # as an outside contributor — a grey check on every release, on a pull
  # request where there is nothing left to check.
  #
  # Skipped by condition rather than removed from the trigger: `pull_request`
  # filters on the *base* branch, and what has to be matched here is the head.
  # The expression is repeated per job on purpose — the `env` context is not
  # available in a job-level `if:`, so lifting it to a variable here would
  # evaluate to null, compare unequal, and quietly skip nothing at all.
  # Every third-party action below is pinned to a full commit SHA, not a tag:
  # a tag is mutable, and a compromised one would run with our token. The
  # trailing comment records which release the SHA belongs to.
  NODE_VERSION: 22

jobs:
  quality:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, format:check, 'test:unit']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  # Supply-chain gate (#209): a high or critical advisory in what ships stops
  # the pull request. `--prod` audits `dependencies` only, and Nuxt and Nuxt
  # UI are build tools in devDependencies — so the client runtime they inject
  # (vue-router, @unhead/vue, ofetch, reka-ui) is listed there directly, at
  # the versions the lock resolves. Their smaller helpers (defu, ufo,
  # hookable, @vueuse/core, tailwind-variants, …) also reach the bundle and
  # are NOT audited here: residual risk, docs/21 §2.2. @unhead/vue declares
  # Vite as a dependency, so a Vite advisory can still fail this job. Reads the lock file only; no install needed.
  audit:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm audit --prod --audit-level high
      # The two services answer the internet themselves, each from its own lock file.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: hub
      - run: npm audit --omit=dev --audit-level=high
        working-directory: catalogue

  # The two services beside the app, each its own npm package with its own
  # lock file and no build step: the hub, and the catalogue's ETL on the
  # mini-dump (docs/16 §9, M21.2) — four hundred real releases, built into
  # SQLite in well under a second, with golden files for the fields that
  # bite. `node:sqlite` needs Node 22.13 or later, which "22" resolves to.
  # Everything below `quality` waits for the pull request to leave draft.
  # On a push, `github.event.pull_request` is null and `!null` is true.
  services:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [hub, catalogue]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}
      # The catalogue's load smoke (docs/17 §4, M23): the mini-dump served by
      # a child process, hammered for five seconds; a floor a runner clears
      # by a mile, so that a regression of an order of magnitude is red.
      - if: matrix.service == 'catalogue'
        run: npm run load -- --seconds 5 --floor 300
        working-directory: catalogue

  build:
    needs: quality
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The app has to load in the basement of a record shop over 3G.
      # Exceeding the budget breaks the build — that is the whole point of it.
      - run: pnpm size

  # Eight runners, an eighth of the suite each.
  #
  # The suite is four hundred browser tests and it ran ten minutes, of which
  # eight were the tests themselves on one four-core box: four workers, each
  # about half busy, because a browser test spends most of its life waiting.
  # Splitting it by `--shard` is the only thing that adds CPU — and for a
  # public repository it is free.
  #
  # Measured 2026-09-14, before any of this: 590 s for the job, 60 s of it
  # downloading browsers that never change between runs.
  # Does this pull request touch anything the browser suite can see? Asked of
  # the API rather than of git, so there is no checkout and no history to
  # fetch. The list is what the app is built from plus what the suite runs —
  # wider than the code directories on purpose: a dependency bump or a
  # config change breaks the browser as surely as a component does. Missing
  # a path here means a red main later, so when in doubt, add it.
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          if grep -qE '^(app|worker|db|shared|public|tokens|scripts|tests/(e2e|fixtures|helpers))/|^(nuxt\.config\.ts|playwright\.config\.ts|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|\.github/workflows/ci\.yml)$' <<<"$files"; then
            echo app=true >> "$GITHUB_OUTPUT"
          else
            echo app=false >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # On main always; on a pull request only out of draft and only when
    # `changes` found something. `!cancelled()` is what lets this run on a
    # push at all — without a status function, a skipped `needs` skips it.
    needs: changes
    if: ${{ !cancelled() && !startsWith(github.head_ref, 'release-please--') && (github.event_name == 'push' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    # Browsers and the system libraries they link against, baked in.
    #
    # WebKit is not optional — the app is a PWA whose weakest target is iOS
    # Safari — and WebKit is also the one that needs libraries a runner image
    # does not carry: measured 2026-09-14, `playwright install-deps` was 55 s
    # of apt on every shard, and skipping it made WebKit fail to launch on
    # four of six. The image has them.
    #
    # The tag must match the `@playwright/test` in the lock file. Nothing here
    # enforces that, and nothing has to: a mismatch makes Playwright refuse to
    # start with the two version numbers in the message.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browsers come with the image (see `container:` above), so there is
      # no download and no apt here. Playwright refuses to start if the two
      # versions disagree, which is the check this needs and all it needs.
      - run: pnpm exec playwright --version
      # Includes the @axe-core/playwright pass. The Discogs API is never called
      # here; a real smoke test belongs in a nightly run, not in a per-PR job
      # that would burn the rate limit for merges.
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/8
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
