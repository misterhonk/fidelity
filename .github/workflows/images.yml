name: Images

# Fertige Images, damit ein Heimserver nichts bauen muss.
#
# Der Unterschied zur Zip-Datei aus dem Release ist die Zielgruppe: wer die
# Seite auf einen Webspace legt, braucht Dateien; wer sie im Heimnetz betreibt,
# braucht `docker compose pull` — und zwar ohne den Quelltext zu klonen und ohne
# zwölf Minuten Nuxt-Build auf einem Raspberry Pi.
#
# Deshalb auch arm64: ein Homelab ist oft genau dieser Raspberry Pi, und ein
# Image nur für amd64 wäre für die halbe Zielgruppe wertlos.

on:
  # Aufgerufen von release.yml, sobald release-please ein Release angelegt hat.
  #
  # Und zwar aufgerufen und nicht durch den Tag ausgelöst: GitHub startet
  # bewusst keine Abläufe aus Ereignissen, die mit GITHUB_TOKEN erzeugt wurden
  # — sonst könnte ein Ablauf sich selbst auslösen. release-please legt Tag und
  # Release genau so an. Gemessen am 2026-08-11: v0.9.0 entstand, und dieser
  # Ablauf rührte sich nicht.
  workflow_call:
    inputs:
      version:
        description: 'Versions-Tag, z. B. v0.9.0'
        required: true
        type: string
  # Ein von Hand gepushter Tag löst dagegen sehr wohl aus.
  push:
    tags: ['v*']
  # Und von Hand: um vor einem Release zu prüfen, dass beide Images bauen —
  # oder um nach einem halb durchgelaufenen Release nachzuziehen.
  #
  # Die Version ist dabei nicht optional-nett, sondern der Unterschied zwischen
  # brauchbaren und nutzlosen Images. Ohne sie und auf einem Branch greift von
  # den Regeln unten nur `type=sha`: kein `0.16.0`, kein `latest`. Am
  # 2026-08-12 genau so passiert — von Hand gestartet, zwei Images gebaut, und
  # kein Mensch hätte sie ziehen können. Wer nachzieht, gibt hier den Tag an
  # (oder startet den Ablauf gleich auf dem Tag).
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag, z. B. v0.16.0 — leer lassen heißt: nur ein Probelauf'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Kein fail-fast: läuft der Hub durch und die App nicht, will man das
      # Hub-Image trotzdem haben — die beiden hängen nicht voneinander ab
      # (ADR-008).
      fail-fast: false
      matrix:
        include:
          # Nicht app.Dockerfile: das baut alles selbst und ist für lokal
          # gedacht. Hier wird die Seite einmal nativ gebaut (siehe unten) und
          # nur noch hineinkopiert — siehe app.prebuilt.Dockerfile für das
          # Warum, kurz: das Ergebnis ist auf beiden Architekturen dasselbe,
          # und der emulierte Lauf scheiterte an Schriften, die zur Bauzeit von
          # Google geholt werden.
          - name: app
            dockerfile: deploy/app.prebuilt.Dockerfile
            needs-site: true
          - name: hub
            dockerfile: deploy/hub.Dockerfile
            needs-site: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      # Nur für die App, und nur einmal — nativ auf dem Runner, mit Netz.
      - if: matrix.needs-site
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
      - if: matrix.needs-site
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.needs-site
        run: pnpm install --frozen-lockfile
      - if: matrix.needs-site
        run: pnpm build

      # QEMU nur wegen arm64. Ohne das baut der Runner ausschließlich für die
      # Architektur, auf der er selbst läuft.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` nur auf einem echten Versions-Tag, nie aus einem Handlauf:
      # sonst zeigt `latest` irgendwann auf etwas, das nie ein Release war.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            # Aus einem Tag-Push: der Ref trägt die Version.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Aus release.yml: dort steht der Ref auf main, der Tag existiert
            # aber schon — also kommt die Version als Eingabe herein.
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            # Ein Handlauf steht auf einem Branch, nicht auf einem Versions-Tag,
            # und erzeugt aus den drei Regeln darüber deshalb *keinen* Tag —
            # woraufhin der Push mit "tag is needed when pushing to registry"
            # abbricht. Genau so beim ersten Testlauf passiert. Ein
            # Commit-Tag hält den Probelauf funktionsfähig, ohne `latest` zu
            # berühren.
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Nuxt-Build dauert; ohne Cache zahlt jedes Release das doppelt,
          # einmal je Architektur.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
