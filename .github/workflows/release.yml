name: Release

on:
  push:
    branches: [main]

# release-please, not semantic-release: it opens a release PR that collects the
# changelog and the version bump and can be edited before the merge. For an app
# that human gate is the point (docs/07-DEV-PIPELINE.md §3).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Die fertige Seite an das Release hängen.
  #
  # Wer Fidelity nur *benutzen* will, soll dafür keine Werkzeugkette brauchen.
  # Ohne diesen Schritt heißt „auf den eigenen Webspace legen": Node
  # installieren, pnpm besorgen, tausend Pakete holen, bauen — für eine App,
  # die am Ende aus Dateien besteht, die man hochlädt.
  #
  # Läuft nur, wenn release-please gerade wirklich ein Release angelegt hat.
  site:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Ein Zip, nicht ein Tar: das Ziel ist jemand, der es im Dateimanager
      # aufmacht und den Inhalt per FTP in seinen Docroot zieht.
      #
      # Die .htaccess kommt mit hinein, und das ist der Punkt. Wer ein Zip
      # herunterlädt, liest kein Repository — die Datei, ohne die Unterseiten
      # auf Apache schieflaufen, muss im Paket liegen und nicht in einer
      # Anleitung. Auf nginx stört sie niemanden, der ignoriert sie.
      - name: Seite verpacken
        run: |
          # Das Zip ist für die Wurzel eines Docroots gedacht — wer es
          # woanders auspackt, ändert die eine Zeile selbst. Der Platzhalter
          # darf jedenfalls nicht mit ausgeliefert werden: eine .htaccess mit
          # `RewriteBase __FIDELITY_BASE__` ist still unwirksam, und still ist
          # die schlechteste Art, kaputt zu sein.
          sed "s|__FIDELITY_BASE__|/|" deploy/.htaccess > .output/public/.htaccess
          cp deploy/LIESMICH.txt .output/public/LIESMICH.txt
          cd .output/public
          zip -qr "../../fidelity-${{ needs.release-please.outputs.tag }}.zip" . -x '.DS_Store'

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            "fidelity-${{ needs.release-please.outputs.tag }}.zip" --clobber

  # Die beiden Abläufe, die ein Tag *nicht* auslösen kann — siehe die
  # Begründung in images.yml. Deshalb werden sie hier aufgerufen.
  images:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}

  deploy:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
