name: Release

on:
  push:
    branches: [main]

# release-please, not semantic-release: it opens a release PR that collects the
# changelog and the version bump and can be edited before the merge. For an app
# that human gate is the point (docs/07-DEV-PIPELINE.md §3).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Legt das Release an — und beantwortet danach getrennt davon die Frage,
  # von der alles Weitere abhängt.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.pending.outputs.ship }}
      tag: ${{ steps.pending.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      # `continue-on-error`, und das ist der ganze Punkt dieser Datei.
      #
      # Am 2026-08-12 hat diese Action das Release 0.16.0 **angelegt** — Tag,
      # GitHub-Release, Kommentar am PR — und ist danach beim Aufräumen der
      # Labels ausgestiegen, mit leerer Meldung: `release-please failed:` und
      # nichts dahinter. Ein gescheiterter Job hat keine Outputs, also wurden
      # `site`, `images` und `deploy` alle übersprungen: Tag und Release
      # standen, es gab kein Zip, keine Images, und die Seite lief weiter auf
      # der Vorversion. Das einzige Signal war ein rotes Kreuz an einem
      # Ablauf, der scheinbar nur beim Labeln gescheitert war.
      #
      # Ein zweiter Anlauf half nicht: die Action sieht das Release dann als
      # vorhanden und meldet `release_created: false`.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Laut, aber nicht tödlich. Der Schritt darunter sieht selbst nach.
      - if: steps.release.outcome == 'failure'
        run: |
          echo "::warning title=release-please ist ausgestiegen::Der Ablauf prüft jetzt selbst, ob ein Release ausgeliefert werden muss."

      # Die richtige Frage.
      #
      # Nicht „hat release-please gerade etwas angelegt" — das ist eine Frage
      # über den Zustand einer Action — sondern „gibt es ein Release, das noch
      # nicht ausgeliefert ist". Die Antwort steht in der Welt und nicht in
      # einem Job-Output: die Version im Manifest, das Release dazu, und das
      # Zip daran als Beleg, dass der Rest schon gelaufen ist.
      #
      # Damit ist der Ablauf auch wiederholbar. Ein halb durchgelaufener
      # Release wird beim nächsten Push auf main fertig gemacht, und ein
      # vollständiger löst nichts aus, egal wie oft dieser Ablauf noch läuft.
      - name: Steht ein Release aus?
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          tag="v${version}"
          zip="fidelity-${tag}.zip"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Kein Release für ${tag}. Nichts auszuliefern."
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Das Zip ist der Beleg: es entsteht im `site`-Job und in keinem
          # anderen. Liegt es am Release, ist dieser Stand ausgeliefert.
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$zip"; then
            echo "${tag} ist bereits ausgeliefert."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} ist angelegt, aber ${zip} fehlt — ausliefern."
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

  # Die fertige Seite an das Release hängen.
  #
  # Wer Fidelity nur *benutzen* will, soll dafür keine Werkzeugkette brauchen.
  # Ohne diesen Schritt heißt „auf den eigenen Webspace legen": Node
  # installieren, pnpm besorgen, tausend Pakete holen, bauen — für eine App,
  # die am Ende aus Dateien besteht, die man hochlädt.
  #
  # Läuft, solange ein Release existiert, an dem dieses Zip noch fehlt — und
  # danach nie wieder, weil das Zip dann daran hängt.
  site:
    needs: release-please
    if: needs.release-please.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Ein Zip, nicht ein Tar: das Ziel ist jemand, der es im Dateimanager
      # aufmacht und den Inhalt per FTP in seinen Docroot zieht.
      #
      # Die .htaccess kommt mit hinein, und das ist der Punkt. Wer ein Zip
      # herunterlädt, liest kein Repository — die Datei, ohne die Unterseiten
      # auf Apache schieflaufen, muss im Paket liegen und nicht in einer
      # Anleitung. Auf nginx stört sie niemanden, der ignoriert sie.
      - name: Seite verpacken
        run: |
          # Das Zip ist für die Wurzel eines Docroots gedacht — wer es
          # woanders auspackt, ändert die eine Zeile selbst. Der Platzhalter
          # darf jedenfalls nicht mit ausgeliefert werden: eine .htaccess mit
          # `RewriteBase __FIDELITY_BASE__` ist still unwirksam, und still ist
          # die schlechteste Art, kaputt zu sein.
          sed "s|__FIDELITY_BASE__|/|" deploy/.htaccess > .output/public/.htaccess
          cp deploy/LIESMICH.txt .output/public/LIESMICH.txt
          cd .output/public
          zip -qr "../../fidelity-${{ needs.release-please.outputs.tag }}.zip" . -x '.DS_Store'

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            "fidelity-${{ needs.release-please.outputs.tag }}.zip" --clobber

  # Die beiden Abläufe, die ein Tag *nicht* auslösen kann — siehe die
  # Begründung in images.yml. Deshalb werden sie hier aufgerufen.
  images:
    needs: release-please
    if: needs.release-please.outputs.ship == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}

  deploy:
    needs: release-please
    if: needs.release-please.outputs.ship == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
