name: Deploy

# Eine neue Fassung auf den eigenen Server bringen.
#
# Optional, und zwar wirklich: ohne eingerichtete Zugangsdaten überspringt sich
# dieser Ablauf selbst, statt bei jedem Release rot zu werden. Wer Fidelity über
# das Zip oder über Docker betreibt, braucht ihn nie.
#
# Einzurichten sind vier Geheimnisse im Repository
# (Settings → Secrets and variables → Actions):
#
#   DEPLOY_HOST     server.example.de
#   DEPLOY_USER     benutzername
#   DEPLOY_KEY      ein privater SSH-Schlüssel (nur für dieses Deployment!)
#   DEPLOY_PATH     /pfad/zur/wurzel   ← nicht der Docroot, siehe unten
#
# **DEPLOY_PATH ist nicht der Docroot.** Der Docroot des Webservers zeigt auf
# <DEPLOY_PATH>/current — einen Symlink, den deploy/publish.sh umlegt. Das ist
# der Grund, warum ein Besucher nie eine halb ausgetauschte Seite sieht.
# Einmalig einzurichten, danach ändert sich daran nie wieder etwas.

on:
  # Aufgerufen von release.yml. Ein `release: published` von release-please
  # löst nichts aus — GitHub startet keine Abläufe aus Ereignissen, die mit
  # GITHUB_TOKEN erzeugt wurden.
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

  # Von Hand gestartet ist ein Trockenlauf die **Vorgabe**.
  #
  # Der Knopf heißt "Run workflow" und sieht harmlos aus, aber der echte Weg
  # löscht ein Verzeichnis auf einem fremden Rechner und legt einen Symlink um.
  # Wer das will, hakt es ab; wer nur wissen will, ob die Zugangsdaten stimmen,
  # drückt einfach.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, nichts hochladen'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Nie zwei Auslieferungen gleichzeitig auf denselben Server.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Ohne diese Zeile sind die vier Geheimnisse unsichtbar.
    #
    # Sie liegen in einer *Environment*, nicht in den Repository-Geheimnissen,
    # und ein Job sieht Environment-Geheimnisse ausschließlich, wenn er die
    # Umgebung nennt. Fehlt sie, ist `secrets.DEPLOY_HOST` schlicht leer — der
    # Ablauf überspringt sich selbst und meldet grün, ohne etwas geprüft zu
    # haben. Genau so ist der erste Trockenlauf am 2026-08-11 ausgegangen.
    #
    # Der Name ist eine Variable mit Vorgabe, damit ein Fork nicht diese hier
    # erbt: `DEPLOY_ENVIRONMENT` setzen, fertig. Environments sind ohnehin auf
    # der Deployments-Seite eines Repositories öffentlich sichtbar, der Name
    # verrät also nichts, was nicht schon dort steht — anders als der Pfad und
    # der Schlüssel, die deshalb Geheimnisse bleiben.
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'martinmelcher.de' }}

    # Zwei Werte, die keine Geheimnisse sind — aber als solche angelegt werden
    # können, weil die Oberfläche „Secrets" zuerst zeigt und „Variables" im
    # Reiter daneben versteckt. Beides wird akzeptiert, damit niemand wegen
    # eines Reiters eine halbe Stunde sucht.
    #
    # Als *Variable* sind sie trotzdem besser aufgehoben: ein Geheimnis wird von
    # GitHub im ganzen Protokoll maskiert, und dann steht dort „Basispfad: ***"
    # und in jeder rsync-Zeile ein Sternchen statt eines Pfades. Ein Basispfad
    # und eine öffentliche Adresse verraten nichts — der Server-Pfad und der
    # Schlüssel schon, und die bleiben deshalb Geheimnisse.
    #
    # Über `env` statt direkt an Ort und Stelle, weil `secrets` in einer
    # `if:`-Bedingung nicht zur Verfügung steht, `env` aber schon.
    env:
      BASE_URL: ${{ vars.DEPLOY_BASE_URL || secrets.DEPLOY_BASE_URL || '/' }}
      SITE_URL: ${{ vars.DEPLOY_URL || secrets.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      # Zuerst nachsehen, ob überhaupt ein Ziel eingerichtet ist. Ein Ablauf,
      # der ohne Konfiguration scheitert, macht jedes Release rot und wird nach
      # der dritten Mail ignoriert — dann fällt ein echter Fehler auch nicht
      # mehr auf.
      - name: Ist ein Ziel eingerichtet?
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"

          # Automatisch aufgerufen: still überspringen. Ein Ablauf, der ohne
          # Konfiguration scheitert, macht jedes Release rot und wird nach der
          # dritten Mail ignoriert — dann fällt ein echter Fehler auch nicht
          # mehr auf.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Kein DEPLOY_HOST gesetzt — nichts auszuliefern."
            exit 0
          fi

          # Von Hand gestartet ist es das Gegenteil: jemand hat den Knopf
          # gedrückt, um etwas zu erfahren. Grün zu melden, ohne irgendetwas
          # geprüft zu haben, ist die schlechteste Antwort — genau das ist am
          # 2026-08-11 passiert, und es sah aus wie ein bestandener Test.
          echo "::error::DEPLOY_HOST ist leer — der Lauf hat nichts geprüft."
          echo
          echo "Am häufigsten liegt es daran, dass die vier Werte in einer"
          echo "*Environment* liegen statt in den Repository-Geheimnissen."
          echo "Ein Job sieht Environment-Geheimnisse nur, wenn er die Umgebung"
          echo "auch deklariert — dieser hier tut das nicht."
          echo
          echo "Zu finden unter: Settings → Secrets and variables → Actions"
          echo "  Tab 'Secrets', Abschnitt 'Repository secrets'"
          exit 1

      - if: steps.check.outputs.ready == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # Unter welchem Pfad die App später liegt, muss sie beim **Bauen** wissen:
      # jede Referenz auf /_nuxt/ und /_fonts/ wird hier festgeschrieben. Als
      # Repository-Variable, nicht als Geheimnis — ein Pfad ist keins, und im
      # Protokoll zu sehen, wohin gebaut wurde, ist die halbe Fehlersuche.
      #
      #   Settings → Secrets and variables → Actions → Variables
      #   DEPLOY_BASE_URL   /fidelity/     ← mit Schrägstrich hinten
      #
      # Leer heißt Wurzel, also genau das, was Docker und das Zip erwarten.
      - if: steps.check.outputs.ready == 'true'
        name: Bauen, für den Pfad, unter dem es liegen wird
        env:
          NUXT_APP_BASE_URL: ${{ env.BASE_URL }}
        run: |
          echo "Basispfad: $NUXT_APP_BASE_URL"
          pnpm build

      # Die .htaccess gehört zur ausgelieferten Seite, genau wie im Release-Zip.
      # Ohne sie verhalten sich Unterseiten auf Apache falsch.
      - if: steps.check.outputs.ready == 'true'
        run: cp deploy/.htaccess .output/public/.htaccess

      - if: steps.check.outputs.ready == 'true'
        name: Schlüssel bereitlegen
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Den Hostschlüssel einmal holen, statt die Prüfung abzuschalten.
          # StrictHostKeyChecking=no würde jeden Server akzeptieren, der gerade
          # unter dieser Adresse antwortet.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Der Trockenlauf: alles, was Auskunft gibt, und nichts, was schreibt.
      #
      # Es gibt genau vier Arten, wie ein Deployment beim ersten Mal scheitert,
      # und jede sieht im echten Lauf gleich aus — eine abgebrochene Verbindung.
      # Hier bekommt jede ihre eigene Zeile: kommt der Schlüssel durch, gibt es
      # das Verzeichnis, darf der Benutzer dort schreiben, und zeigt `current`
      # schon irgendwohin. `rsync --dry-run` sagt zum Schluss, was der echte
      # Lauf anfassen würde, ohne ein Byte zu übertragen.
      - if: steps.check.outputs.ready == 'true' && inputs.dry_run
        name: Trockenlauf — kommen wir überhaupt hin?
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          SSH="ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15"

          echo "── 1. Anmeldung ──"
          who=$($SSH "$USER@$HOST" 'id -un; uname -n')
          echo "$who" | sed 's/^/   /'

          echo "── 2. Zielverzeichnis ──"
          # Der Pfad wird in der Ausgabe nicht wiederholt: er ist ein Geheimnis,
          # und ein Ablauf-Protokoll ist öffentlich, sobald das Repo es ist.
          $SSH "$USER@$HOST" "test -d '$PATH_ON_SERVER'" \
            && echo "   existiert" \
            || { echo "   FEHLT — DEPLOY_PATH zeigt auf nichts"; exit 1; }

          echo "── 3. Schreibrecht ──"
          $SSH "$USER@$HOST" "test -w '$PATH_ON_SERVER'" \
            && echo "   vorhanden" \
            || { echo "   KEINS — der Benutzer darf dort nicht schreiben"; exit 1; }

          echo "── 4. Symlink current ──"
          $SSH "$USER@$HOST" "
            if [ -L '$PATH_ON_SERVER/current' ]; then
              echo \"   zeigt auf \$(basename \"\$(readlink '$PATH_ON_SERVER/current')\")\"
            else
              echo '   noch keiner — der erste echte Lauf legt ihn an'
            fi"

          echo "── 5. Was der echte Lauf übertragen würde ──"
          rsync -az --delete --dry-run --stats -e "$SSH" \
            .output/public/ "$USER@$HOST:$PATH_ON_SERVER/.incoming/" \
            | grep -E "Number of files|regular files transferred|Total file size" \
            | sed 's/^/   /'

          echo
          echo "Nichts geschrieben, nichts gelöscht, nichts umgeschaltet."

      - if: steps.check.outputs.ready == 'true' && !inputs.dry_run
        name: Hochladen und umschalten
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ inputs.version || github.sha }}
        run: |
          set -eu
          SSH="ssh -i ~/.ssh/id_deploy -o BatchMode=yes"

          # In ein Zwischenverzeichnis, nicht direkt in die neue Fassung: erst
          # wenn alles oben ist, macht publish.sh daraus eine Auslieferung.
          STAGING="$PATH_ON_SERVER/.incoming"
          $SSH "$USER@$HOST" "rm -rf '$STAGING' && mkdir -p '$STAGING'"

          rsync -az --delete -e "$SSH" \
            .output/public/ "$USER@$HOST:$STAGING/"
          rsync -az -e "$SSH" \
            deploy/publish.sh "$USER@$HOST:$PATH_ON_SERVER/publish.sh"

          $SSH "$USER@$HOST" \
            "chmod +x '$PATH_ON_SERVER/publish.sh' && \
             '$PATH_ON_SERVER/publish.sh' '$STAGING' '$PATH_ON_SERVER' '$VERSION' && \
             rm -rf '$STAGING'"

      # Nachsehen, ob die Seite danach wirklich antwortet. Ein Deployment, das
      # niemand prüft, ist eine Hoffnung.
      - if: steps.check.outputs.ready == 'true' && !inputs.dry_run && env.SITE_URL != ''
        name: Antwortet sie?
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL")
          echo "GET $SITE_URL → $code"
          [ "$code" = "200" ] || exit 1
